services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_NAME: ${DATABASE_NAME:-booking}
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - booking-net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-booking}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-booking}"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - booking-net

networks:
  booking-net:
    driver: bridge

volumes:
  postgres-data:
