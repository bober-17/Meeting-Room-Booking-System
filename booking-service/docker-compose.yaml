services:
  booking:
    build:
      context: ..
      dockerfile: booking-service/Dockerfile
    ports:
      - "${BOOKING_SERVER_PORT:-8080}:${BOOKING_SERVER_PORT:-8080}"
    environment:
      BOOKING_SERVER_PORT: ${BOOKING_SERVER_PORT:-8080}
      BOOKING_DATABASE_HOST: ${BOOKING_DATABASE_HOST:?BOOKING_DATABASE_HOST is required}
      BOOKING_DATABASE_PORT: ${BOOKING_DATABASE_PORT:-5432}
      BOOKING_DATABASE_USER: ${BOOKING_DATABASE_USER:?BOOKING_DATABASE_USER is required}
      BOOKING_DATABASE_PASSWORD: ${BOOKING_DATABASE_PASSWORD:?BOOKING_DATABASE_PASSWORD is required}
      BOOKING_DATABASE_NAME: ${BOOKING_DATABASE_NAME:?BOOKING_DATABASE_NAME is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KAFKA_BROKERS: ${KAFKA_BROKERS:?KAFKA_BROKERS is required}
      KAFKA_TOPIC_BOOKING_EVENTS: ${KAFKA_TOPIC_BOOKING_EVENTS:-booking.events}
    read_only: true
    depends_on:
      booking-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - booking-net
      - kafka-net

  booking-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${BOOKING_DATABASE_USER:?BOOKING_DATABASE_USER is required}
      POSTGRES_PASSWORD: ${BOOKING_DATABASE_PASSWORD:?BOOKING_DATABASE_PASSWORD is required}
      POSTGRES_DB: ${BOOKING_DATABASE_NAME:?BOOKING_DATABASE_NAME is required}
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOOKING_DATABASE_USER:-postgres} -d ${BOOKING_DATABASE_NAME:-booking}"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - booking-net

networks:
  booking-net:
    driver: bridge
  kafka-net:
    name: kafka-net
    external: true

volumes:
  booking-postgres-data:
