version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - unused
    - ineffassign
    - gocritic
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/internships-backend/test-backend-bober-17

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
